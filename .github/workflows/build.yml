name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd neutralino-app
          npm install

      - name: Download Neutralino.js & Binaries
        run: |
          cd neutralino-app
          npx @neutralinojs/neu update

      - name: Build, Sign & Package (build.ps1)
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: ./build.ps1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: overtone-windows
          path: |
            overtone-win-x64-*.zip
            Overtone-Setup-*.exe
